        <button type="button" id="nav-history">Histórico</button>
      </nav>
      <div class="right-nav"><button type="button" class="icon-button" id="theme-button" aria-label="Alternar tema" title="Alternar tema"><svg class="icon" id="theme-moon" viewBox="0 0 24 24"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg><svg class="icon hide" id="theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button></div>
    </div>
  </header>
  <main class="wrap">
    <section id="download-page">
      <div class="hero">
        
        <h1>Vídeo ou <em>áudio.</em></h1>
        
        <div class="search-shell">
          <form class="search-form" id="url-form" novalidate>
            <span class="url-icon" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l2-2A5 5 0 0 0 12 3.93l-1.15 1.15"/><path d="M14 11a5 5 0 0 0-7.07 0l-2 2A5 5 0 0 0 12 20.07l1.15-1.15"/></svg></span>
            <input id="url-input" type="url" spellcheck="false" inputmode="url" autocomplete="url" placeholder="Cole um link do YouTube ou Vimeo" aria-label="URL do vídeo">
            <button class="primary" type="submit" id="inspect-btn">Analisar <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
          </form>
        </div>
        <div id="error" class="error hide" role="alert"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span id="error-text"></span></div>
        <div class="under-search"><span class="left">YouTube · Vimeo</span><button type="button" class="secondary" id="example-btn">Exemplo <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg></button></div>
      </div>
      <div id="loading" class="loading hide" role="status" aria-live="polite"><div class="scanner"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4z"/></svg></div><strong>Analisando link…</strong><div class="skeleton-line"></div></div>
      <section id="results" class="results hide" aria-label="Formatos de arquivo">
        <div class="result-top"><div class="section-head">Formatos disponíveis</div></div>
        <div class="result-card">
          <div class="left-pane">
            <div class="poster" id="poster" role="img" aria-label="Capa do vídeo">
              <div class="poster-lines"></div>
              <div class="poster-inner"><div class="play-button"><svg class="icon" viewBox="0 0 24 24"><path d="m7 3 15 9-15 9z"/></svg></div></div>
            </div>
            <div class="media-details"><div class="media-platform" id="media-platform">YouTube</div><div class="media-title" id="media-title">Vídeo de exemplo</div><div class="media-meta"><span id="media-duration"></span></div></div>
          </div>
          <div class="right-pane">
            
            <div class="segment" role="group" aria-label="Tipo de arquivo"><button class="selected" type="button" id="kind-video" aria-pressed="true"><svg class="icon icon-sm" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Vídeo</button><button type="button" id="kind-audio" aria-pressed="false"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Áudio</button></div>
            <div class="control-label">Qualidade</div><div id="format-list" class="option-list" role="group" aria-label="Qualidade e formato do arquivo"></div>
            <div class="file-options"><label class="toggle-row"><input type="checkbox" id="metadata" checked>Capa e metadados</label><label class="toggle-row"><input type="checkbox" id="public-history">Publicar no histórico</label></div>
            <div class="bottom-actions"><button class="primary" id="prepare-btn" type="button"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg>Preparar arquivo</button></div>
            <div id="prep-panel" class="prep-panel hide" aria-live="polite"><div class="prep-head"><strong id="prep-title">Obtendo arquivo</strong><span id="prep-percent">0%</span></div><div class="prep-track" role="progressbar" id="prep-progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progresso do processamento"><div class="prep-fill" id="prep-fill"></div></div></div>
          </div>
        </div>
      </section>
      <div class="footer"><small>Use apenas mídia que você tem permissão para baixar.</small></div>
    </section>
    <section id="history-page" class="hide" aria-label="Histórico público">
      <div class="history-head"><div><h2 class="history-title">Histórico público</h2></div><input id="history-search" class="history-search" type="search" placeholder="Buscar no histórico" aria-label="Buscar no histórico"></div>
      <div class="history-panel" id="history-list"></div><div class="footer"><small>Somente registros autorizados</small></div>
    </section>
  </main><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
