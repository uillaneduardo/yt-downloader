services:
  yt-downloader:
    build: .
    image: yt-downloader:local
    container_name: yt-downloader
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${YT_PORT:-8098}:8000"
    environment:
      DATA_DIR: /data
      PUBLIC_HOST: ${PUBLIC_HOST:-yt.ulln.com.br}
      TRUST_CF_IP: ${TRUST_CF_IP:-0}
      MAX_FILE_MB: ${MAX_FILE_MB:-1024}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-5400}
      FILE_TTL_SECONDS: ${FILE_TTL_SECONDS:-7200}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-2700}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-20}
      MAX_PLAYLIST_TOTAL_MB: ${MAX_PLAYLIST_TOTAL_MB:-2048}
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 1200m
    cpus: 2.0
    tmpfs:
      - /tmp:size=256m,mode=1777